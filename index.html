                <div class="row g-3 min-vh-100" id="homepageMeals">
                    <!-- 20 random meals -->
                </div>
            </section>
            <section class="search d-none  min-vh-100  ">
                <div class="search-input d-flex justify-content-center align-items-center">
                    <div class="container ">
                        <form class="row gap-5 m-3">
                            <input type="text" class="bg-black text-white border border-white p-2 col-5 rounded-1" name="mealName"
                                id="mealName" placeholder="Search by Name">
                            <input type="text" maxlength="1" class="bg-black text-white border border-white p-2 col-5 rounded-1"
                                name="mealFirstLetter" id="mealFirstLetter" placeholder="Search by First Letter">
                        </form>
                    </div>
                </div>
                <div class="row g-4" id="searchedMeals">
                </div>
            </section>
            <section class="categories d-none">
                <div class="row p-3 min-vh-100" id="categoriesMeals">
                </div>
            </section>
            <section class="area d-none">
                <div class="row min-vh-100 p-3" id="areasMeals">
                </div>
            </section>
            <section class="ingredients d-none">
                <div class="row min-vh-100" id="ingredientsMeals">
                </div>
            </section>
            <section class="contact-us d-flex justify-content-center align-items-center  p-5  min-vh-100 d-none">
                <div class="form-submit w-75  d-flex flex-column justify-content-center align-items-center">
                    <div class="row">
                        <div class="col">
                            <input type="text" class="form-control m-3" name="name" id="name"
                                placeholder="Enter Your Name" aria-label="First name">
                            <div class="alert alert-danger d-none" role="alert">
                                Special characters and numbers not allowed
                            </div>
                        </div>
                        <div class="col">
                            <input type="email" name="email" id="email" class="form-control m-3"
                                placeholder="Enter Your Email" aria-label="Last name">
                            <div class="alert alert-danger d-none" role="alert">
                                Email not valid *exemple@yyy.zzz
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input ype="tel" name="phone" id="phone" class="form-control m-3"
                                placeholder="Enter Your Phone" aria-label="First name">
                            <div class="alert alert-danger d-none" role="alert">
                                Enter valid Phone Number
                            </div>
                        </div>
                        <div class="col">
                            <input type="number" name="age" id="age" class="form-control m-3"
                                placeholder="Enter Your Age" aria-label="Last name">
                            <div class="alert alert-danger d-none" role="alert">
                                Enter valid Age
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input type="password" name="password" id="password" class="form-control m-3"
                                placeholder="Enter Your Password" aria-label="First name">
                            <div class="alert alert-danger d-none" role="alert">
                                Enter valid password : Minimum eight characters, at least one letter and one number
                            </div>
                        </div>
                        <div class="col">
                            <input type="password" name="repassword" id="repassword" class="form-control m-3"
                                placeholder="Repassword" aria-label="Last name">
                            <div class="alert alert-danger d-none" role="alert">
                                Enter valid repassword
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="border border-danger rounded-1 bg-black text-danger m-3 p-1 px-2" id="submitBtn">Submit</button>
                </div>

            </section>
